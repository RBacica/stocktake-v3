[package]
name = "stocktake-v3"
version = "2.0.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
tiberius = { version = "0.12", features = ["tds73", "native-tls", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
deadpool-tiberius = "0.1"
futures-util = "0.3"
chrono = "0.4"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
