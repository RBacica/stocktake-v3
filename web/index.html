            renderTable();
        });

        // ─────────────────────────────────────
        //  Treat-No-Count-As-Zero Toggle
        // ─────────────────────────────────────
        function toggleZeroCount() {
            treatNoCountAsZero = !treatNoCountAsZero;
            const cb = document.getElementById('treat-no-count-zero');
            const toggle = document.getElementById('zero-toggle');
            cb.checked = treatNoCountAsZero;
            toggle.classList.toggle('active', treatNoCountAsZero);
        }

        document.getElementById('treat-no-count-zero').addEventListener('change', function() {
            treatNoCountAsZero = this.checked;
            document.getElementById('zero-toggle').classList.toggle('active', this.checked);
        });

        // ─────────────────────────────────────
        //  Stats Bar
        // ─────────────────────────────────────
        function updateStats(total, counted, uncounted, variance, ticketsCount) {
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-counted').textContent = counted;
            document.getElementById('stat-uncounted').textContent = uncounted;
            document.getElementById('stat-variance').textContent = variance;
            document.getElementById('stat-tickets').textContent = ticketsCount;
        }

        // ─────────────────────────────────────
        //  Save Results (server-side CSV save)
        // ─────────────────────────────────────
        async function saveResults() {
            // Build rows: counted items + (if treatNoCountAsZero) uncounted items as 0
            let rows = [];

            allItems.forEach(item => {
                const v = counts[item.upc];
                const hasCount = v != null && v !== '';
                const count = hasCount ? Math.round(parseFloat(v) || 0) : 0;

                if (hasCount) {
                    // User entered a count — always include
                    rows.push({
                        upc: item.upc,
                        description: item.description,
                        department: item.department || '',
                        supplier: item.supplier || '',
                        stock_on_hand: item.stock_on_hand,
                        count: count,
                        variance: count - item.stock_on_hand,
                        has_ticket: tickets.has(item.upc),
                        ticket_qty: tickets.has(item.upc) ? (ticketQtys[item.upc] || 1) : 1
                    });
                } else if (treatNoCountAsZero) {
                    // No count entered, but "treat as zero" is on — include as 0
                    rows.push({
                        upc: item.upc,
                        description: item.description,
                        department: item.department || '',
                        supplier: item.supplier || '',
                        stock_on_hand: item.stock_on_hand,
                        count: 0,
                        variance: 0 - item.stock_on_hand,
                        has_ticket: tickets.has(item.upc),
                        ticket_qty: tickets.has(item.upc) ? (ticketQtys[item.upc] || 1) : 1
                    });
                }
            });

            // Always include ticketed items so .qry is generated even when
            // no count was entered and "treat as zero" is off.
            const rowUpcs = new Set(rows.map(r => r.upc));
            for (const item of allItems) {
                if (!rowUpcs.has(item.upc) && tickets.has(item.upc)) {
                    rows.push({
                        upc: item.upc,
                        description: item.description,
                        department: item.department || '',
                        supplier: item.supplier || '',
                        stock_on_hand: item.stock_on_hand,
                        count: 0,
                        variance: 0 - item.stock_on_hand,
                        has_ticket: true,
                        ticket_qty: ticketQtys[item.upc] || 1
                    });
                }
            }

            if (rows.length === 0) {
                alert('No items have been counted yet. Please enter counts before saving.');
                return;
            }

            const saveBtn = document.querySelector('.btn-save');
            const originalLabel = saveBtn ? saveBtn.textContent : 'Export Count';
            if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Exporting…'; }

            try {
                const resp = await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rows })
                });
                const data = await resp.json().catch(() => ({}));

                if (!resp.ok) {
                    throw new Error(data.message || `Server returned ${resp.status}`);
                }

                const fileMsg = data.txt_written
                    ? `\nFile: ${data.file}`
                    : '\n(No count file — .qry only)';
                alert(`✅ Saved ${data.rows || rows.length} item(s).` + fileMsg);
                // Don't resetAll — let user review, they can click Reset
            } catch (err) {
                alert(`❌ Failed to save: ${err.message}`);
            } finally {
                if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = originalLabel; }
            }
        }

        // ─────────────────────────────────────
        //  Load Count File
        // ─────────────────────────────────────
        async function handleFileLoad(input) {
            const file = input.files[0];
            if (!file) return;

            // If no items loaded yet, we need to search first
            if (allItems.length === 0) {
                alert('Please run a search first, then load the count file.');
                input.value = '';
                return;
            }

            showDialog('Loading count file...', file.name);

            try {
                const text = await file.text();
                const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                let loaded = 0;
                let notFound = 0;

                lines.forEach(line => {
                    // Expected format: 0,<UPC>,<Count>,
                    const parts = line.split(',');
                    if (parts.length < 3) return;
                    const upc = parts[1].trim();
                    const count = parseFloat(parts[2].trim());

                    if (isNaN(count)) return;

                    // Check if this UPC exists in our current items list
                    const item = allItems.find(i => i.upc === upc);
                    if (item) {
                        counts[upc] = Math.round(count).toString();
                        loaded++;
                    } else {
                        notFound++;
                    }
                });

                renderTable();
                hideDialog();

                let msg = `Loaded ${loaded} count(s) from ${file.name}.`;
                if (notFound > 0) {
                    msg += `\n${notFound} UPC(s) in the file were not found in the current search results.`
                }
                alert(msg);
            } catch (e) {
                hideDialog();
                alert(`❌ Failed to load file: ${e.message}`);
            }

            // Reset the input so the same file can be re-loaded
            input.value = '';
        }

        // ─────────────────────────────────────
        //  Print Count Sheet
        // ─────────────────────────────────────
        function printCountSheet() {
            if (allItems.length === 0) {
                alert('No items loaded. Please run a search first.');
                return;
            }

            const tbody = document.getElementById('count-sheet-body');
            let html = '';
            let visibleIdx = 0;

            // First pass: determine which items are visible (matching renderTable filters)
            // and whether any of them have counts entered
            let visibleItems = [];
            let hasAnyCount = false;

            allItems.forEach((item) => {
                if (childUpcs.has(item.upc)) return;

                const isParent = childrenByParent[item.upc] && childrenByParent[item.upc].length > 0;
                const variance = isParent ? getParentCombinedVariance(item.upc) : getItemVariance(item.upc);
                const hasVar = Math.abs(variance) >= 0.05;

                const hideVariance = showVarianceOnly && !hasVar;
                const hideTicket = showTicketedOnly && !tickets.has(item.upc);
                const hideUncounted = showUncountedOnly && !isUncounted;
                const hideLookup = lookupFilter !== '' && !item.description.toLowerCase().includes(lookupFilter);
                if (hideVariance || hideTicket || hideUncounted || hideLookup) return;

                const v = counts[item.upc];
                if (v != null && v !== '') hasAnyCount = true;

                visibleItems.push({ item, isParent, variance });
            });

            // Also check children for counts
            if (!hasAnyCount) {
                allItems.forEach((item) => {
                    if (!childUpcs.has(item.upc)) return;
                    const v = counts[item.upc];
                    if (v != null && v !== '') hasAnyCount = true;
                });
            }

            if (visibleItems.length === 0) {
                alert('No items to print. Adjust your filters and try again.');
                return;
            }

            // Choose layout based on whether counts exist
            // Generate the appropriate thead
            const thead = document.getElementById('count-sheet-head');
            if (hasAnyCount) {
                thead.innerHTML = `<tr>
                    <th>#</th><th>UPC</th><th>Description</th>
                    <th>Stock On Hand</th><th>Count</th><th>Var</th><th>Recount</th>
                </tr>`;
            } else {
                thead.innerHTML = `<tr>
                    <th>#</th><th>UPC</th><th>Description</th>
                    <th>Stock On Hand</th><th>Count</th><th>Ticket</th>
                </tr>`;
            }

            if (hasAnyCount) {
                // ── Counted layout: #, UPC, Description, SoH, Count, Var, Recount Box ──
                visibleItems.forEach(({ item, isParent, variance }) => {
                    visibleIdx++;
                    const hasTicket = tickets.has(item.upc);
                    const soh = item.stock_on_hand.toFixed(2);
                    const v = counts[item.upc];
                    const hasCount = v != null && v !== '';
                    const countVal = hasCount ? (Math.round(parseFloat(v) || 0)).toString() : '';
                    const varVal = hasCount ? (Math.round(parseFloat(v) || 0) - item.stock_on_hand).toFixed(2) : '';
                    const varClass = parseFloat(varVal) < 0 ? 'var-negative' : (parseFloat(varVal) > 0 ? 'var-positive' : '');

                    html += `<tr class="parent-row">
                        <td>${visibleIdx}</td>
                        <td class="upc">${escapeHtml(item.upc)}</td>
                        <td class="description">${escapeHtml(item.description)}</td>
                        <td class="stock-on-hand">${soh}</td>
                        <td class="count-val">${countVal}</td>
                        <td class="variance-cell ${varClass}">${varVal}</td>
                        <td><div class="count-box"></div></td>
                    </tr>`;

                    if (isParent) {
                        const children = childrenByParent[item.upc];
                        children.forEach(child => {
                            const childHasTicket = tickets.has(child.upc);
                            const childSoh = child.stock_on_hand.toFixed(2);
                            const cv = counts[child.upc];
                            const childHasCount = cv != null && cv !== '';
                            const childCountVal = childHasCount ? (Math.round(parseFloat(cv) || 0)).toString() : '';
                            const childVarVal = childHasCount ? (Math.round(parseFloat(cv) || 0) - child.stock_on_hand).toFixed(2) : '';
                            const childVarClass = parseFloat(childVarVal) < 0 ? 'var-negative' : (parseFloat(childVarVal) > 0 ? 'var-positive' : '');

                            html += `<tr class="child-row">
                                <td></td>
                                <td class="upc"><span class="indent-marker">├─</span>${escapeHtml(child.upc)}</td>
                                <td class="description">${escapeHtml(child.description)}</td>
                                <td class="stock-on-hand">${childSoh}</td>
                                <td class="count-val">${childCountVal}</td>
                                <td class="variance-cell ${childVarClass}">${childVarVal}</td>
                                <td><div class="count-box"></div></td>
                            </tr>`;
                        });
                    }
                });
            } else {
                // ── Blank layout: #, UPC, Description, SoH, Count, Ticket ──
                visibleItems.forEach(({ item, isParent }) => {
                    visibleIdx++;
                    const hasTicket = tickets.has(item.upc);
                    const soh = item.stock_on_hand.toFixed(2);

                    html += `<tr class="parent-row">
                        <td>${visibleIdx}</td>
                        <td class="upc">${escapeHtml(item.upc)}</td>
                        <td class="description">${escapeHtml(item.description)}</td>
                        <td class="stock-on-hand">${soh}</td>
                        <td><div class="count-box"></div></td>
                        <td class="ticket-cell"><input type="checkbox" ${hasTicket ? 'checked' : ''}></td>
                    </tr>`;

                    if (isParent) {
                        const children = childrenByParent[item.upc];
                        children.forEach(child => {
                            const childHasTicket = tickets.has(child.upc);
                            const childSoh = child.stock_on_hand.toFixed(2);

                            html += `<tr class="child-row">
                                <td></td>
                                <td class="upc"><span class="indent-marker">├─</span>${escapeHtml(child.upc)}</td>
                                <td class="description">${escapeHtml(child.description)}</td>
                                <td class="stock-on-hand">${childSoh}</td>
                                <td><div class="count-box"></div></td>
                                <td class="ticket-cell"><input type="checkbox" ${childHasTicket ? 'checked' : ''}></td>
                            </tr>`;
                        });
                    }
                });
            }

            tbody.innerHTML = html;

            // Small delay to ensure DOM is updated before print dialog
            setTimeout(() => {
                window.print();
            }, 100);
        }

        // ─────────────────────────────────────
        //  Reset
        // ─────────────────────────────────────
        function resetAll() {
            allItems = [];
            counts = {};
            tickets = new Set();
            ticketQtys = {};
            childrenByParent = {};
            childUpcs = new Set();
            lastFilter = { dept: 'ALL', sup: 'ALL' };
            showVarianceOnly = false;
            showTicketedOnly = false;
            document.getElementById('show-variance-only').checked = false;
            document.getElementById('variance-toggle').classList.remove('active');
            document.getElementById('show-ticketed-only').checked = false;
            document.getElementById('ticket-filter-toggle').classList.remove('active');
            document.getElementById('results-body').innerHTML = `
                <tr><td colspan="7">
                    <div class="empty-state">
                        <div class="icon">&#x1F50D;</div>
                        <p>Select a department and/or supplier, then click Search</p>
                    </div>
                </td></tr>`;
            document.getElementById('lookup-input').value = '';
            lookupFilter = '';
            document.getElementById('department-select').value = 'ALL';
            // Reset tracking boxes
            updateStats(0, 0, 0, 0, 0);
            // Reset supplier list to full list
            const supSel = document.getElementById('supplier-select');
            supSel.innerHTML = '<option value="ALL">All Suppliers</option>';
            allSuppliers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.supplier;
                opt.textContent = s.label || s.supplier;
                supSel.appendChild(opt);
            });
        }

        // ─────────────────────────────────────
        //  Utilities
        // ─────────────────────────────────────
        function escapeJs(str) {
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
